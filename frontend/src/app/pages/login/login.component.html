<div class="login-container">
  <div class="login-card">
    <p class="eyebrow">ORGANIZA AÍ</p>
    <h1>Mais clareza.<br>Mais espaço para você.</h1>
    <p class="subtitulo">Entre para continuar de onde parou.</p>

    <form (ngSubmit)="entrar()">
      <div class="form-group">
        <label for="email">E-mail</label>
        <input
          type="email"
          id="email"
          name="email"
          [(ngModel)]="email"
          placeholder="Digite seu e-mail"
          autocomplete="email"
          required
        >
      </div>

      <div class="form-group">
        <label for="senha">Senha</label>
        <input
          type="password"
          id="senha"
          name="senha"
          [(ngModel)]="senha"
          placeholder="Digite sua senha"
          autocomplete="current-password"
          required
        >
      </div>

      <p class="erro" *ngIf="erro" role="alert">{{ erro }}</p>

      <button type="submit" [disabled]="carregando">
        {{ carregando ? 'Entrando…' : 'Entrar' }}
      </button>
    </form>

    <p class="cadastro">
      Ainda não possui uma conta?
      <a routerLink="/cadastro">Cadastre-se</a>
    </p>

    <p class="rodape">Administradores são encaminhados ao console seguro.</p>
  </div>
</div>
