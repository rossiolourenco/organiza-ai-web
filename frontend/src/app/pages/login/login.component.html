<div class="login-container">
  <button type="button" class="theme-toggle" (click)="alternarTema()"
    [attr.aria-label]="theme.dark ? 'Ativar tema claro' : 'Ativar tema escuro'">
    {{ theme.dark ? '☀' : '☾' }}
  </button>

  <div class="login-card">
    <div class="login-brand">
      <span class="brand-mark">✓</span>
      <div>
        <strong>Organiza Aí</strong>
        <span>Premium Experience</span>
      </div>
    </div>

    <h1>Bem-vindo de volta</h1>
    <p class="subtitulo">Entre para continuar de onde parou.</p>

    <form (ngSubmit)="entrar()">
      <div class="form-group">
        <label for="email">E-mail</label>
        <input type="email" id="email" name="email" [(ngModel)]="email"
          placeholder="voce@exemplo.com" autocomplete="email" required>
      </div>

      <div class="form-group">
        <label for="senha">Senha</label>
        <div class="senha-wrap">
          <input [type]="mostrarSenha ? 'text' : 'password'" id="senha" name="senha"
            [(ngModel)]="senha" placeholder="Sua senha" autocomplete="current-password" required>
          <button type="button" class="eye" (click)="mostrarSenha = !mostrarSenha"
            [attr.aria-label]="mostrarSenha ? 'Ocultar senha' : 'Mostrar senha'">
            {{ mostrarSenha ? '◉' : '◎' }}
          </button>
        </div>
      </div>

      <p class="erro" *ngIf="erro" role="alert">{{ erro }}</p>
      <p class="sucesso" *ngIf="aviso" role="status">{{ aviso }}</p>

      <button type="submit" class="entrar" [disabled]="carregando">
        {{ carregando ? 'Entrando…' : 'Entrar' }}
      </button>
    </form>

    <p class="cadastro">Ainda não possui uma conta? <a routerLink="/cadastro">Cadastre-se</a></p>
    <p class="rodape">🔒 Conexão segura · administradores são levados ao console.</p>
  </div>
</div>
