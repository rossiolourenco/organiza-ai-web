name: CI Web

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-web-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web-angular:
    name: web-angular
    runs-on: ubuntu-latest
    env:
      CI: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Locate Chrome
        run: |
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || true)"
          [ -n "$CHROME" ] || { echo "Chrome não encontrado no runner"; exit 1; }
          echo "CHROME_BIN=$CHROME" >> "$GITHUB_ENV"
      - name: Frontend gate
        run: bash scripts/verify-premium.sh --frontend

  web-backend:
    name: web-backend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Setup Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: backend/pom.xml
      - name: Backend gate
        run: bash scripts/verify-premium.sh --backend

  web-admin:
    name: web-admin
    runs-on: ubuntu-latest
    env:
      CI: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Locate Chrome
        run: |
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || true)"
          [ -n "$CHROME" ] || { echo "Chrome não encontrado no runner"; exit 1; }
          echo "CHROME_BIN=$CHROME" >> "$GITHUB_ENV"
      - name: Admin gate
        run: bash scripts/verify-premium.sh --admin
